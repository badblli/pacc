<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PACC</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Metinler extension/i18n/*.json kataloglarından gelir: data-i18n="anahtar" (popup.js doldurur) -->
    <h1>
      <img src="../icons/icon-48.png" alt="" />
      <span><span data-i18n="app.name"></span><small data-i18n="popup.tagline"></small></span>
    </h1>

    <label class="lang">
      <span data-i18n="popup.lang"></span>
      <select id="uiLang">
        <option value="auto" data-i18n="popup.langAuto"></option>
        <option value="en" lang="en">English</option>
        <option value="tr" lang="tr">Türkçe</option>
      </select>
    </label>

    <label class="opt">
      <input type="checkbox" id="translation" />
      <span>
        <b data-i18n="popup.translation"></b>
        <small data-i18n="popup.translationHint"></small>
      </span>
    </label>

    <label class="opt">
      <input type="checkbox" id="panel" />
      <span>
        <b data-i18n="popup.panel"></b>
        <small data-i18n="popup.panelHint"></small>
      </span>
    </label>

    <label class="opt">
      <input type="checkbox" id="planner" />
      <span>
        <b data-i18n="popup.planner"></b>
        <small data-i18n="popup.plannerHint"></small>
      </span>
    </label>

    <label class="opt">
      <input type="checkbox" id="overlay" />
      <span>
        <b data-i18n="popup.overlay"></b>
        <small data-i18n="popup.overlayHint"></small>
      </span>
    </label>

    <label class="opt">
      <input type="checkbox" id="poolTracking" />
      <span>
        <b data-i18n="popup.pool"></b>
        <small data-i18n="popup.poolHint"></small>
      </span>
    </label>

    <label class="opt">
      <input type="checkbox" id="record" />
      <span><b data-i18n="popup.record"></b><small data-i18n="popup.recordHint"></small></span>
    </label>
    <button id="downloadRecording" disabled></button>
    <button id="clearRecording" data-i18n="popup.clearRecording" disabled></button>
    <p id="recordError" role="status"></p>

    <div class="status" id="status" data-i18n="popup.checking"></div>
    <button id="refresh" data-i18n="popup.refresh"></button>

    <p class="foot" data-i18n="popup.foot"></p>
    <p class="brand">
      <span data-i18n="popup.by"></span> <a href="https://github.com/badblli" target="_blank" rel="noopener">badblli</a>
      · <a href="https://github.com/badblli/pacc" target="_blank" rel="noopener">GitHub</a>
    </p>
    <script src="../content/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
