<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PACC · Panel deneme tahtası</title>
<!--
  Paneli (extension/content/panel.js) eklenti olmadan dener: chrome.* yerine küçük bir taklit, gerçek
  static.json + çeviri dosyası ve sahte meta verisi kullanır.

  file:// ile açılmaz (fetch engellenir). Depo kökünden bir yerel sunucu başlat:
    node -e "require('http').createServer((q,s)=>{const f=require('path').join(process.cwd(),decodeURIComponent(q.url.split('?')[0]));require('fs').readFile(f,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.writeHead(200,{'content-type':{'.html':'text/html;charset=utf-8','.json':'application/json','.js':'text/javascript','.css':'text/css','.png':'image/png'}[require('path').extname(f)]||'application/octet-stream'});s.end(d)})}).listen(8123)"
  sonra http://localhost:8123/tests/panel-harness.html adresini aç.

  Adres parametreleri:  ?autotest=1  otomatik senaryoları çalıştırır, sonuç #report içinde ve başlıkta
                        ?open=pokemon|comps|items|game&q=charmander  paneli o sekmede açar
                        ?lang=en|tr|auto  arayüz dili (settings.uiLang); yoksa kayıtlı ayar / tarayıcı dili
-->
<style>
  :root { color-scheme: dark; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: #e5eceb; background: #0f1a22; }
  body { margin: 0; min-height: 100vh; padding: 20px 24px; background: repeating-linear-gradient(0deg, #ffffff03 0 1px, transparent 1px 4px); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #a6bbc0; margin: 4px 0 12px; max-width: 640px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button { font: inherit; color: #dce9eb; background: #233742; border: 1px solid #4d6874; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: #8cf2a4; }
  /* Oyun kısayol testi: panelde yazarken buraya hiçbir tuş ulaşmamalı */
  #keys { color: #ffd77e; min-height: 24px; font-family: monospace; }
  #report { margin-top: 16px; font: 13px/1.5 monospace; white-space: pre-wrap; max-width: 760px; }
  .pass { color: #8cf2a4; } .fail { color: #ff8c7d; }
  .fake-overlay { position: fixed; z-index: 2147483640; left: 20px; top: 120px; width: 220px; padding: 16px; border: 2px solid #8cf2a4; background: #14212bf5; }
</style>
<h1>PACC · panel deneme tahtası</h1>
<p>Sağ alttaki simgeye tıkla ya da aşağıdan aç. Panelde bir şey yazarken oyunun kısayolları (aşağıdaki satır) tetiklenmemeli.</p>
<div class="bar">
  <button data-open="pokemon">Pokémon sekmesi</button>
  <button data-open="comps">Dizilimler</button>
  <button data-open="items">Itemler</button>
  <button data-open="game">Oyunum (canlı oyun)</button>
  <button id="no-game">Oyun yok</button>
  <button id="kill">Eklenti yeniden yüklendi gibi yap</button>
  <button id="reset">Kayıtlı konumu sıfırla</button>
</div>
<div id="keys">oyuna ulaşan tuşlar: </div>
<div class="fake-overlay">Sahte overlay (z-index altında kalmalı)</div>
<div id="report"></div>

<script>
  // ---------- chrome.* taklidi ----------
  const STORE_KEY = "pac-harness-storage"
  const mem = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") } catch { return {} } })()
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(mem)) } catch {} }
  const listeners = { storage: [], message: [] }
  let alive = true
  // ?lang=en|tr|auto → settings.uiLang (popup'taki dil seçicinin yerine)
  const langParam = new URLSearchParams(location.search).get("lang")
  if (langParam) mem.settings = { ...(mem.settings ?? {}), uiLang: langParam }

  const guard = () => { if (!alive) throw new Error("Extension context invalidated.") }
  window.chrome = {
    runtime: {
      get id() { return alive ? "harness" : undefined },
      getURL(path) { guard(); return new URL("../extension/" + path, location.href).href },
      sendMessage(msg) { guard(); return Promise.resolve(msg?.type === "get-meta" ? { meta: FAKE_META } : {}) },
      onMessage: { addListener: (fn) => listeners.message.push(fn), removeListener: (fn) => { const i = listeners.message.indexOf(fn); if (i >= 0) listeners.message.splice(i, 1) } }
    },
    storage: {
      local: {
        async get(keys) {
          guard()
          const list = typeof keys === "string" ? [keys] : keys
          return Object.fromEntries(list.filter((k) => k in mem).map((k) => [k, structuredClone(mem[k])]))
        },
        async set(obj) {
          guard()
          const changes = {}
          for (const [k, v] of Object.entries(obj)) { changes[k] = { oldValue: mem[k], newValue: v }; mem[k] = structuredClone(v) }
          persist()
          listeners.storage.forEach((fn) => fn(changes, "local"))
        }
      },
      onChanged: { addListener: (fn) => listeners.storage.push(fn), removeListener: (fn) => { const i = listeners.storage.indexOf(fn); if (i >= 0) listeners.storage.splice(i, 1) } }
    }
  }

  // ---------- sahte meta ----------
  // Biçim: pokemons[tier][ad] = [ortalama sıra, oyun sayısı, ortalama item sayısı, en çok kullanılan itemler]
  // Bilerek: CHARMANDER / CHARMELEON LEVEL_BALL'da kayıt yok (arama "meta yok" notuyla göstermeli),
  // CHARMANDER NET_BALL'da var (başka elo ipucu için), MAGIKARP az örnekli.
  const FAKE_META = {
    createdAt: "2026-10-18T05:00:00Z", games: 5766, checkedAt: Date.now(),
    thresholds: { FIRE: [2, 4, 6], DRAGON: [3, 5, 7], WATER: [3, 6, 9], STEEL: [2, 4, 6, 8], ARTIFICIAL: [2, 4, 6], GHOST: [2, 4, 6], AMORPHOUS: [3, 6, 9] },
    pokemons: {
      LEVEL_BALL: {
        GYARADOS: [3.7, 5766, 1.9, ["MUSCLE_BAND", "SHELL_BELL", "KINGS_ROCK"]],
        CHARIZARD: [3.1, 1671, 2.1, ["FIRE_STONE", "LEFTOVERS", "MUSCLE_BAND"]],
        PIKACHU: [4.2, 1570, 1.2, ["LIGHT_BALL"]],
        RAICHU: [4.9, 800, 1.1, []],
        EEVEE: [5.1, 400, 0.4, []],
        VAPOREON: [3.9, 600, 1.6, ["WATER_STONE"]],
        MAGIKARP: [6.2, 12, 0.1, []],
        MR_MIME: [4.4, 300, 1.0, ["WONDER_BOX"]],
        BLASTOISE: [3.4, 900, 2.0, ["WATER_STONE", "SHELL_BELL"]]
      },
      NET_BALL: { CHARMANDER: [4.5, 184, 0.3, []], CHARIZARD: [3.5, 226, 2.0, ["FIRE_STONE"]], GYARADOS: [3.9, 2474, 1.8, ["SHELL_BELL"]] }
    },
    items: { LEVEL_BALL: {}, NET_BALL: {} },
    clusters: [
      { id: "c1", count: 400, winrate: 31, rank: 3.1, synergies: { STEEL: 8, ARTIFICIAL: 6, GHOST: 6, AMORPHOUS: 3 },
        pokemons: [{ name: "CHARIZARD", frequency: 0.8, items: ["FIRE_STONE", "LEFTOVERS"] }, { name: "GYARADOS", frequency: 0.6, items: ["SHELL_BELL"] }, { name: "BLASTOISE", frequency: 0.55, items: [] }, { name: "RAICHU", frequency: 0.5, items: [] }],
        items: [], topTeams: [{ rank: 1, elo: 1500, pokemons: [{ name: "CHARIZARD", items: ["FIRE_STONE"] }, { name: "GYARADOS", items: [] }] }] },
      { id: "c2", count: 250, winrate: 18, rank: 4.0, synergies: { FIRE: 6, DRAGON: 3, WATER: 3 },
        pokemons: [{ name: "CHARIZARD", frequency: 0.7, items: [] }, { name: "VAPOREON", frequency: 0.5, items: [] }], items: [], topTeams: [] }
    ]
  }

  // ---------- panelin seçeceği oyun verileri ----------
  const GAME_SNAP = {
    uid: "u1", stage: 6, phase: "PICK", money: 28, life: 62, rank: 3, alive: true, streak: 2, interest: 2, maxInterest: 5,
    level: 6, experience: 4, expNeeded: 20, maxLevel: 9, map: "ICE", regionalPokemons: [], additionalPokemons: [],
    board: [
      { name: "CHARMANDER", x: 1, y: 1, stars: 1, items: [], types: ["DRAGON", "FIRE"] },
      { name: "SQUIRTLE", x: 2, y: 1, stars: 1, items: ["WATER_STONE"], types: ["WATER"] },
      { name: "MAGIKARP", x: 3, y: 0, stars: 1, items: [], types: ["WATER"] }
    ],
    inventory: ["FIRE_STONE", "MUSCLE_BAND", "SHELL_BELL", "KINGS_ROCK"],
    shop: ["CHARMANDER", "MAGIKARP", "PIKACHU", "EEVEE", "BULBASAUR"],
    choices: [{ id: "p1", type: "pokemon", pokemons: ["CHARMANDER", "SQUIRTLE", "PIKACHU"], items: [], costs: [] }, { id: "i1", type: "item", pokemons: [], items: ["FIRE_STONE", "MUSCLE_BAND", "KINGS_ROCK"], costs: [] }],
    itemsProposition: ["FIRE_STONE", "MUSCLE_BAND", "KINGS_ROCK"], pokemonsProposition: ["CHARMANDER", "SQUIRTLE", "PIKACHU"],
    synergies: { FIRE: 2, WATER: 2, DRAGON: 1 }, opponent: { id: "o", name: "Rakip", life: 40, board: [{ name: "GYARADOS", x: 1, y: 1, stars: 2, items: ["SHELL_BELL"], types: ["WATER"] }], synergies: { WATER: 3 } },
    players: 8, taken: {}
  }
  const sendGame = (on = true) => {
    window.postMessage({ type: "pac-yardimci:health", status: on ? "ok" : "idle", inGame: on }, location.origin)
    window.postMessage({ type: "pac-yardimci:game", snapshot: on ? GAME_SNAP : null }, location.origin)
  }
  setInterval(() => sendGame(Boolean(window.__gameOn !== false)), 1500)

  // Oyun kısayolu testi: sayfaya ulaşan her tuşu göster
  addEventListener("keydown", (e) => { document.getElementById("keys").textContent += e.key + " " })
</script>
<script src="../extension/content/i18n.js"></script>
<script src="../extension/content/advisor.js"></script>
<script src="../extension/content/panel.js"></script>
<script>
  const host = () => document.getElementById("pac-yardimci")
  const sroot = () => host()?.shadowRoot
  const $ = (sel) => sroot()?.querySelector(sel)
  const $$ = (sel) => [...(sroot()?.querySelectorAll(sel) ?? [])]
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
  const params = new URLSearchParams(location.search)
  // Oyun dışı sekmeleri denerken sahte oyun verisi sekmeyi "Oyunum"a çevirmesin
  if (params.get("open") && params.get("open") !== "game") window.__gameOn = false

  // Panel oyunun /assets/ yoluna bakar. Deneme tahtasında yer tutucu resim (renkli kare) konur; ?real=1 ile gerçek siteden çekilir.
  const placeholder = (path) => {
    let h = 0
    for (const c of path) h = (h * 31 + c.charCodeAt(0)) % 360
    const round = path.includes("/types/") ? 16 : 6
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="${round}" fill="hsl(${h} 55% 45%)"/><rect x="9" y="9" width="14" height="14" rx="3" fill="hsl(${h} 60% 75%)"/></svg>`
    return "data:image/svg+xml," + encodeURIComponent(svg)
  }
  const fixImages = (scope) => {
    for (const img of scope.querySelectorAll('img[src^="/assets/"]')) {
      const path = img.getAttribute("src")
      img.src = params.get("real") ? "https://pokemon-auto-chess.com" + path : placeholder(path)
    }
  }
  const watchRoot = setInterval(() => {
    if (!sroot()) return
    clearInterval(watchRoot)
    new MutationObserver(() => fixImages(sroot())).observe(sroot(), { childList: true, subtree: true })
  }, 20)


  async function ready() {
    for (let i = 0; i < 100; i++) { if ($(".launcher") && $("main .empty, main .card, main input")) return; await sleep(50) }
  }
  const openPanel = async (tab) => {
    await ready()
    if ($(".panel").hidden) $(".launcher").click()
    if (tab) $(`nav button[data-tab="${tab}"]`).click()
    await sleep(60)
  }
  async function search(text) {
    const input = $('[data-role="query"]')
    input.focus()
    input.value = text
    input.dispatchEvent(new Event("input", { bubbles: true, composed: true }))
    await sleep(200)
    return input
  }
  const names = () => $$('[data-role="results"] > .card .name').map((n) => n.firstChild.textContent.trim())

  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", async () => {
    await openPanel(b.dataset.open)
    if (b.dataset.open === "game") { window.__gameOn = true; sendGame(true) }
  }))
  document.getElementById("no-game").onclick = () => { window.__gameOn = false; sendGame(false) }
  document.getElementById("kill").onclick = () => { alive = false }
  document.getElementById("reset").onclick = () => { delete mem.panelBox; persist(); location.reload() }

  // ---------- otomatik senaryolar ----------
  async function autotest() {
    const out = []
    const check = (name, ok, extra = "") => out.push({ name, ok: Boolean(ok), extra })
    const report = () => {
      const failed = out.filter((r) => !r.ok).length
      document.getElementById("report").innerHTML = out.map((r) => `<div class="${r.ok ? "pass" : "fail"}">${r.ok ? "GEÇTİ" : "KALDI"}  ${r.name}${r.extra ? "  — " + r.extra : ""}</div>`).join("") + `<div>${failed ? "HATA: " + failed : "TÜMÜ GEÇTİ"} (${out.length} kontrol)</div>`
      document.title = failed ? `FAIL ${failed}` : "PASS " + out.length
    }
    // Dile bağlı beklentiler (Pokémon adları iki dilde de oyunun İngilizce adları)
    await window.PacI18n.ready
    const L = window.PacI18n.lang
    const X = {
      tr: { noMeta: /Meta verisi yok/, otherTier: /ve üstünde 184 oyun var/, stats: /5\.766 oyun/, none: /sonuç yok/, shop: /dükkanda: Charmander/, compsTab: "Dizilimler", other: "en", otherCompsTab: "Comps" },
      en: { noMeta: /No meta data/, otherTier: /and above: 184 games/, stats: /5,766 games/, none: /No results/, shop: /in shop: Charmander/, compsTab: "Comps", other: "tr", otherCompsTab: "Dizilimler" }
    }[L]
    try {
      if (sessionStorage.getItem("phase2")) {
        sessionStorage.removeItem("phase2")
        out.push(...JSON.parse(sessionStorage.getItem("out1") || "[]"))
        await openPanel()
        const want = JSON.parse(sessionStorage.getItem("wantBox"))
        const r = $(".panel").getBoundingClientRect()
        check("[kalıcılık] yeniden yüklenince konum/boyut hatırlandı", Math.abs(r.left - want.left) < 1.5 && Math.abs(r.top - want.top) < 1.5 && Math.abs(r.width - want.width) < 1.5 && Math.abs(r.height - want.height) < 1.5, JSON.stringify([r.left, r.top, r.width, r.height].map(Math.round)) + " vs " + JSON.stringify(want))
        report()
        return
      }
      delete mem.panelBox; persist()
      // Sahte oyun mesajı ilk gelişte paneli "Oyunum"a çevirir; arama adımları bitene kadar kapalı (aşağıda yeniden açılır)
      window.__gameOn = false
      check(`arayüz dili: ${L}`, ["en", "tr"].includes(L))
      await openPanel("pokemon")
      const input = await search("chari")
      check("'chari' → Charizard bulunur", names().includes("Charizard"), names().join(", "))
      check("arama kutusu yerinde kaldı ve odakta", $('[data-role="query"]') === input && sroot().activeElement === input)
      await search("Charmander")
      const nm = $$('[data-role="results"] > .card.nometa .name').map((n) => n.firstChild.textContent.trim())
      check("'Charmander' → Charmander + evrimleri listelenir", ["Charmander", "Charmeleon", "Charizard"].every((n) => names().includes(n)), names().join(", "))
      check("meta kaydı olmayan Pokémon 'Meta verisi yok' notuyla görünür", nm.includes("Charmander") && $$(".card.nometa .stat.warn").some((e) => X.noMeta.test(e.textContent)))
      check("başka elo ipucu gösterilir", X.otherTier.test($(".card.nometa .note-line")?.textContent ?? ""), $(".card.nometa .note-line")?.textContent)
      await search("GYARADOS")
      check("'GYARADOS' → sonuç + istatistik satırı", names()[0] === "Gyarados" && X.stats.test($(".card .stats")?.textContent ?? ""), $(".card .stats")?.textContent.trim().replace(/\s+/g, " "))
      await search("charizard")
      check("'charizard' → aile gelir, aranan aşama vurgulanır", names().includes("Charmander") && $$(".evo-mon.hit").length >= 1 && $(".evo-mon.hit .evo-name").textContent === "Charizard")
      const strip = $(".card .evo")
      check("evrim şeridi: Charmander → Charmeleon → Charizard sıralı, ★ ile", strip && /Charmander.*★.*Charmeleon.*★★.*Charizard.*★★★/s.test(strip.textContent.replace(/\s+/g, " ")), strip?.textContent.replace(/\s+/g, " "))
      await search("PİKACHU")
      check("Türkçe İ ile büyük harf aramasi ('PİKACHU')", names().includes("Pikachu"), names().join(", "))
      await search("mr mime")
      check("'mr mime' (ayraçlı) → Mr. Mime", names().some((n) => /mime/i.test(n)), names().join(", "))
      await search("zzzzqq")
      check("sonuçsuz arama boş durum gösterir", X.none.test($('[data-role="results"]').textContent))
      await search("")
      check("boş arama → en çok oynanan liste", names().length === 9 && names()[0] === "Gyarados", names().join(", "))
      // klavye yalıtımı: panelde yazılan tuş sayfaya ulaşmamalı
      document.getElementById("keys").textContent = ""
      $('[data-role="query"]').dispatchEvent(new KeyboardEvent("keydown", { key: "d", bubbles: true, composed: true }))
      check("panelde yazarken oyun kısayolları tetiklenmez", document.getElementById("keys").textContent === "")
      const z = (el) => getComputedStyle(el).zIndex
      check("panel overlay'in üstünde (z-index)", Number(z($(".panel"))) > Number(getComputedStyle(document.querySelector(".fake-overlay")).zIndex))
      // Dizilimler
      await openPanel("comps")
      check("dizilim başlığında sinerji ikonları + sayı var", $$(".syn-badge").length >= 3 && $(".syn-badge img").alt !== "" && /8/.test($(".syn-badge b").textContent))
      check("dizilimde Charizard altında 'dükkanda: Charmander'", $$(".member .shop-hint").some((h) => X.shop.test(h.textContent)))
      // Dil canlı değişir (popup'taki seçici gibi storage üzerinden) ve geri alınır
      const tabText = () => $('nav button[data-tab="comps"]').textContent
      check("sekme adı seçili dilde", tabText() === X.compsTab, tabText())
      await chrome.storage.local.set({ settings: { ...mem.settings, uiLang: X.other } })
      await sleep(400)
      check(`dil canlı değişir (${L} → ${X.other})`, tabText() === X.otherCompsTab && $$(".syn-badge").length >= 3, tabText())
      await chrome.storage.local.set({ settings: { ...mem.settings, uiLang: L } })
      await sleep(400)
      check(`dil geri döner (${X.other} → ${L})`, tabText() === X.compsTab, tabText())
      // Oyunum
      window.__gameOn = true; sendGame(true)
      await sleep(900)
      await openPanel("game")
      await sleep(500)
      const sections = $$("main > details.sec")
      check("Oyunum: acil bölümler en üstte ve vurgulu", sections.length >= 1 && sections[0].classList.contains("hl"), sections.map((s) => s.dataset.sec).join(","))
      // Boyutlandırma ve kalıcılık
      const before = $(".panel").getBoundingClientRect()
      const grip = $(".grip.nw")
      const ev = (type, x, y) => grip.dispatchEvent(new PointerEvent(type, { bubbles: true, composed: true, clientX: x, clientY: y, pointerId: 7 }))
      ev("pointerdown", before.left + 4, before.top + 4)
      ev("pointermove", before.left - 80, before.top - 60)
      ev("pointerup", before.left - 80, before.top - 60)
      await sleep(100)
      const after = $(".panel").getBoundingClientRect()
      check("sol-üst köşeden büyütülür (sağ-alt sabit)", after.width > before.width + 60 && Math.abs(after.right - before.right) < 1.5 && Math.abs(after.bottom - before.bottom) < 1.5, `${Math.round(before.width)}x${Math.round(before.height)} → ${Math.round(after.width)}x${Math.round(after.height)}`)
      check("panelBox chrome.storage.local'a yazıldı", mem.panelBox && Math.abs(mem.panelBox.width - after.width) < 1.5)
      // başlıktan sürükleme
      const head = $("header")
      const hev = (type, x, y) => head.dispatchEvent(new PointerEvent(type, { bubbles: true, composed: true, clientX: x, clientY: y, pointerId: 8 }))
      hev("pointerdown", after.left + 30, after.top + 15)
      hev("pointermove", after.left + 10, after.top + 35)
      hev("pointerup", after.left + 10, after.top + 35)
      await sleep(100)
      const moved = $(".panel").getBoundingClientRect()
      check("başlıktan sürüklenir", Math.abs(moved.left - (after.left - 20)) < 1.5 && Math.abs(moved.top - (after.top + 20)) < 1.5)
      // eklenti geçersizleşmesi
      sessionStorage.setItem("wantBox", JSON.stringify({ left: moved.left, top: moved.top, width: moved.width, height: moved.height }))
      sessionStorage.setItem("phase2", "1")
      const logs = []
      const info = console.info
      console.info = (...a) => { logs.push(a.join(" ")); info(...a) }
      const errors = []
      addEventListener("error", (e) => errors.push(e.message))
      addEventListener("unhandledrejection", (e) => errors.push(String(e.reason)))
      alive = false
      await sleep(1600)
      console.info = info
      check("eklenti yeniden yüklenince panel DOM'dan kalkar", !host())
      check("tek satır console.info yazılır, hata fırlatmaz", logs.length === 1 && errors.length === 0, `${logs.length} log, ${errors.length} hata ${errors.join("|")}`)
      sessionStorage.setItem("out1", JSON.stringify(out))
      alive = true
      setTimeout(() => location.reload(), 300)
    } catch (err) {
      check("senaryo hatasız çalıştı", false, String(err?.stack ?? err))
      report()
    }
  }

  if (params.get("autotest")) autotest()
  else if (params.get("open")) {
    ;(async () => {
      await openPanel(params.get("open"))
      if (params.get("q")) await search(params.get("q"))
    })()
  }
</script>
